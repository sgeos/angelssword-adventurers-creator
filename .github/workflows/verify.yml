# The first three jobs run exactly what `npm run check`, `npm test` and
# `npx playwright test` run locally. Nothing in them is CI-only: a green run
# means the same commands pass on a clean checkout, and a red one is
# reproducible with a single local command.
#
# The last two exist for a different reason. The container and the standalone
# binary are built by hand or not at all, and both went unbuilt long enough to
# break: the image stopped starting when the server gained an import the
# Dockerfile did not copy, and nobody noticed for months because building it is
# something a person has to remember. A validity assertion that only a human
# executes is an assertion that rots. These make the machine do it.
#
# They also close a recorded open item. Neither the Linux nor the Windows
# binary had ever been built, which was treated as blocked on hardware nobody
# had. The runners are that hardware.
#
# Supply chain, following sgeos/project-template. Actions are pinned to full
# commit hashes with the release tag in a comment, so a moved or compromised
# tag cannot change what runs, and Dependabot proposes newer pins. Checkouts
# do not persist the token, and no job is given more than read access to the
# repository or any secret. The workflows job lints this file.
name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to a pull request supersedes its in-flight run. Every other
# run is grouped by its own identifier, so a run on main is never cancelled:
# a cancelled run is the latest result the README's badge reads, and GitHub
# draws a cancellation as "failing".
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

# No permissions by default. Each job grants only what it needs.
permissions: {}

jobs:
  check:
    name: typecheck and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The lowest version the project claims to support. Testing the
          # floor rather than the newest release is the point: the server runs
          # TypeScript through native type stripping, and that is exactly the
          # capability the floor is chosen for.
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - run: npm ci

      # The mobile application is its own package. Its project, and the Metro
      # configuration in the tools project, resolve types from its
      # node_modules, so the check needs both installs.
      - run: npm ci --prefix mobile

      # Repository hygiene from sgeos/project-template, then the typecheck of
      # every tsconfig project, the mobile one included, and the lint.
      - run: ./scripts/check.sh

  mobile:
    name: mobile bundles
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci --prefix mobile

      # Bundles the application for Android as Expo Go would load it: the
      # native bundle, and the DOM component's web bundle beside it. This is
      # the step that exercises metro.config.mts and babel-transformer.mts,
      # which no typecheck can, because they decide how the shared sources
      # are resolved and transformed. No native build: that needs the Android
      # SDK, and Expo Go supplies the native half.
      - run: npx expo export --platform android --output-dir "$RUNNER_TEMP/mobile-export"
        working-directory: mobile
        env:
          EXPO_NO_TELEMETRY: '1'

  test:
    name: unit and API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.18.0'
          cache: npm

      - run: npm ci

      - run: npm test

  browser:
    name: browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.18.0'
          cache: npm

      - run: npm ci

      # --with-deps pulls the system libraries the headless browser needs,
      # which a bare runner does not have.
      - run: npx playwright install --with-deps chromium

      # playwright.config.ts starts the server itself, and its command builds
      # the page first, so the specs cannot pass against a stale bundle.
      - run: npx playwright test

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  container:
    name: container builds and serves
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No setup-node: the image builds its own toolchain, and using the
      # runner's Node here would test something the image does not contain.
      - run: docker build -t as-adventurer-ci .

      # Port 3001 is free on a runner. A development machine usually has it
      # occupied, which is why the documented manual procedure uses another
      # port; that is a local inconvenience and not a property of the image.
      - name: Serve from the container and fetch from it
        run: |
          set -euo pipefail
          docker run -d --name as-ci -p 3001:3001 as-adventurer-ci
          for _ in $(seq 1 30); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/)" = "200" ]; then
              break
            fi
            sleep 1
          done

          # The page alone would pass even if nothing were built, so fetch the
          # module script the page itself names and require it to be non-empty.
          # The name is hashed by the build, so it is read, never written out.
          curl -sf http://127.0.0.1:3001/ -o page.html
          module=$(grep -o 'src="/assets/[^"]*\.js"' page.html | head -n 1 | cut -d '"' -f 2)
          test -n "$module"
          curl -sf "http://127.0.0.1:3001$module" -o module.js
          test -s module.js

          # 401 rather than 404: the proxy routes registered. A missing module
          # at startup used to leave the server dead, and a wrong route name
          # answers 404, so this distinguishes the two.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' -d '{}' \
            http://127.0.0.1:3001/api/generate)
          test "$code" = "401"

      - name: What the container said, if any of that failed
        if: failure()
        run: docker logs as-ci || true

      - name: Stop it
        if: always()
        run: docker rm -f as-ci || true

  binary:
    name: binary builds and serves (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      # A Windows failure must not hide the Linux result, nor the reverse.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            exe: ./ASAdventurer
          - os: windows-latest
            exe: ./ASAdventurer.exe
    defaults:
      run:
        # Git Bash on the Windows runner, so one script serves both hosts.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.18.0'
          cache: npm

      - run: npm ci

      # Node's single executable feature does not cross-compile: the binary is
      # for the host that built it, which is the whole reason this runs on two.
      - run: node build-exe.mts

      - name: Serve from the binary and fetch from it
        run: |
          set -euo pipefail
          cd dist/ASAdventurer
          PORT=3999 AS_NO_OPEN=1 ${{ matrix.exe }} > server.log 2>&1 &
          for _ in $(seq 1 30); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3999/)" = "200" ]; then
              break
            fi
            sleep 1
          done

          curl -sf http://127.0.0.1:3999/ -o page.html
          # Matters more than the page: it proves the page's scripts were built
          # and packaged rather than only that the server started.
          module=$(grep -o 'src="/assets/[^"]*\.js"' page.html | head -n 1 | cut -d '"' -f 2)
          test -n "$module"
          curl -sf "http://127.0.0.1:3999$module" -o module.js
          test -s module.js

          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' -d '{}' \
            http://127.0.0.1:3999/api/generate)
          test "$code" = "401"

      - name: What the binary said, if any of that failed
        if: failure()
        run: cat dist/ASAdventurer/server.log || true

  # Lints the workflows themselves, as sgeos/project-template does. actionlint
  # checks syntax, expressions and the shell in run steps, and zizmor checks
  # for known weaknesses such as injection through untrusted input, excessive
  # permissions and unpinned actions. The actionlint image is pinned by
  # digest, and zizmor's version explicitly.
  workflows:
    name: workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: >-
          docker run --rm --volume "$PWD:/repo" --workdir /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color
      - name: zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: 1.31.1
          advanced-security: false
